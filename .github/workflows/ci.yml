name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Verify packages and unit tests
        run: |
          moon version --all
          moon update
          moon check --target all
          moon test --target native
          moon test --target js
          moon test --target wasm-gc
          moon info
          moon fmt
          git diff --exit-code
      - name: Verify stdio process roundtrip
        run: |
          moon build --target native src/integration/stdio-roundtrip
          executable="$PWD/_build/native/debug/build/integration/stdio-roundtrip/stdio-roundtrip"
          timeout 30s env MCP_STDIO_INTEGRATION_SERVER="$executable" "$executable"
      - name: Verify HTTP socket roundtrip
        run: |
          moon build --target native src/integration/http-roundtrip
          executable="$PWD/_build/native/debug/build/integration/http-roundtrip/http-roundtrip"
          timeout 30s env MCP_HTTP_INTEGRATION_SERVER="$executable" "$executable"
      - name: Verify frozen MCP 2026-07-28 server requirements
        run: |
          moon build --target native src/integration/conformance-server
          executable="$PWD/_build/native/debug/build/integration/conformance-server/conformance-server"
          "$executable" >conformance-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:8080/mcp; then
              break
            fi
            sleep 0.1
          done
          npx --yes @modelcontextprotocol/conformance@0.2.0-alpha.11 \
            server \
            --url http://127.0.0.1:8080/mcp \
            --requirements 2026-07-28
      - name: Verify frozen MCP 2026-07-28 client requirements
        run: |
          moon build --target native src/integration/conformance-client
          executable="$PWD/_build/native/debug/build/integration/conformance-client/conformance-client"
          npx --yes @modelcontextprotocol/conformance@0.2.0-alpha.11 \
            client \
            --command "$executable" \
            --requirements 2026-07-28 \
            --timeout 30000
