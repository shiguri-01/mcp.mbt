name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Verify packages and unit tests
        run: |
          moon version --all
          moon update
          moon check --target all
          moon test --target native
          moon test --target js
          moon test --target wasm-gc
          moon info
          moon fmt
          git diff --exit-code
